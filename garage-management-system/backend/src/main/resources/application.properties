spring.application.name=garage-management

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/garage_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=Ym9vdHN0cmFwLWdhcmFnZS1tYW5hZ2VtZW50LXN5c3RlbS1zZWNyZXQta2V5LTIwMjQtc3VwZXItc2VjdXJlLWtleQ==
app.jwt.expiration=86400000

# File paths
app.upload.dir=./uploads/invoices

# Server
server.port=8080

# Logging
logging.level.com.garage=DEBUG

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
